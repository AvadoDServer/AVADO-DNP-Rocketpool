[unix_http_server]
file=/dev/shm/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///dev/shm/supervisor.sock

; Smartnode node daemon. start-node.sh exits with 78 when the configuration
; is unsupported, the upgrade backup failed or Smartnode rejects the settings;
; 78 is "expected", so the daemon then stays stopped (state EXITED) and the UI
; explains why from /tmp/rocketpool-startup-error.txt (one line) and
; /tmp/avado-start-status.json. Any other exit restarts it.
; Output goes to stdout (docker logs) and, via scripts/log-tee.sh, to
; /var/log/rocketpool/daemon.log (rotated at 5 MB to daemon.log.1).
[program:rocketpool-node]
command=/srv/rocketpool/start-node.sh
autostart=true
autorestart=unexpected
exitcodes=78
startsecs=0
stopsignal=TERM
stopwaitsecs=60
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; AVADO backend: serves the UI and /api on port 80.
[program:backend]
directory=/usr/src/backend
command=node /usr/src/backend/dist/server.js
environment=NODE_ENV="production"
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=15
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
