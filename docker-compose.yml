version: '3.4'
services:
  rocketpool.avado.dnp.dappnode.eth:
    image: 'rocketpool.avado.dnp.dappnode.eth:1.0.2'
    build:
      context: .
      dockerfile: build/Dockerfile
    volumes:
      - 'rocketpool:/rocketpool'
    environment:
      - NETWORK=mainnet
      - EXECUTIONCLIENT=geth
      - CONSENSUSCLIENT=prysm
      - EXTRA_OPTS=
volumes:
  rocketpool: {}
